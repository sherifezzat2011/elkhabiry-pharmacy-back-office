name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Add GitHub Pages route fallbacks
        run: |
          cp dist/index.html dist/404.html
          for route in \
            reports/sales-overview \
            reports/order-sources \
            reports/executive-brief \
            reports/sales/product-performance \
            reports/sales/sales-concentration \
            reports/sales/orders-by-area \
            reports/sales/orders-analysis \
            catalog/categories \
            catalog/products \
            catalog/brands \
            order-sources \
            delivery/local-delivery \
            delivery/pricing \
            delivery/channels \
            delivery/zones \
            suppliers \
            suppliers/purchase-orders \
            suppliers/goods-receiving \
            reports/suppliers/supplier-performance \
            reports/suppliers/purchase-volume \
            reports/suppliers/delivery-performance \
            reports/suppliers/supplier-ranking \
            reports/customers/customer-acquisition \
            reports/customers/repeat-behavior \
            reports/customers/inactivity \
            reports/customers/customer-value \
            reports/customers/customer-segmentation \
            reports/customers/vip-customers \
            reports/customers/purchase-frequency \
            reports/prescriptions/prescription-trends \
            reports/prescriptions/dispensing-performance \
            reports/prescriptions/completion-rate \
            reports/prescriptions/prescription-status \
            reports/prescriptions/prescription-fulfillment \
            reports/prescriptions/doctor-prescription-volume \
            reports/doctors/doctor-performance \
            reports/doctors/prescription-volume \
            reports/doctors/revenue-contribution \
            reports/doctors/specialty-analysis \
            reports/doctors/product-preference \
            reports/doctors/doctor-ranking \
            reports/promotions/offers \
            reports/promotions/promo-codes \
            sales/orders \
            sales/customers
          do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
